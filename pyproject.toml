[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vastbase-llamaindex-stores"
version = "0.1.0"
description = "LlamaIndex stores (Vector + Chat) integration for Vastbase using pyvastbase SDK"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "llama-index-core>=0.13.0,<0.15",
    "pyvastbase>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
include = ["llama_index*"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that require a live Vastbase connection",
]
